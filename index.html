<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: Canvas; color: CanvasText;
  }
  main { max-width: 34rem; padding: 2rem; }
  h1 { font-size: 2.25rem; line-height: 1.2; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
  p { margin: 0 0 1rem; }
  .tagline { font-size: 1.125rem; }
  footer { font-size: 0.8125rem; opacity: 0.65; border-top: 1px solid; border-color: color-mix(in srgb, CanvasText 15%, transparent); padding-top: 1rem; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.875em; }
</style>
</head>
<body>
  <main>
    <h1>{{.Heading}}</h1>
    <p class="tagline">{{.Tagline}}</p>
    <p>A local run signed a receipt bound to this exact commit. CI read that
       receipt, skipped every step it already covered, and went straight to
       deploy.</p>
    <footer>
      Served at {{.Built}} · <code>runner run --project . api:preflight</code>
    </footer>
  </main>
</body>
</html>
