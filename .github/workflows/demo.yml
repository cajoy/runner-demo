name: Runner demo

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  RUNNER_VERSION: v0.8.2
  RUNNER_BUNDLE: ${{ github.workspace }}/.runner-bundle

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      execute_count: ${{ steps.plan.outputs.execute_count }}
      level_0: ${{ steps.plan.outputs.level_0 }}
      level_1: ${{ steps.plan.outputs.level_1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install the pinned Runner toolchain
        uses: ./.github/actions/install-runner
        with:
          repository-token: ${{ secrets.RUNNER_REPOSITORY_TOKEN }}

      - name: Verify receipts for this commit and plan the graph
        id: plan
        run: |
          mkdir -p .runner-ci
          "$RUNNER_BUNDLE/runner_${RUNNER_VERSION}_linux_amd64" ci plan api:github \
            --project "$GITHUB_WORKSPACE" \
            --policy .runner/receipt-policy.yaml \
            --policy-ref origin/main \
            --branch "$GITHUB_REF_NAME" \
            --remote origin \
            --fetch \
            --output .runner-ci/plan.json \
            --github-output "$GITHUB_OUTPUT" \
            --json

      - name: Show the scheduling decision per task
        run: jq -r '.tasks[] | "\(.decision)\t\(.id)\t\(.reason // "")"' .runner-ci/plan.json

      - uses: actions/upload-artifact@v4
        with:
          name: runner-plan
          path: .runner-ci/plan.json
          if-no-files-found: error

  execute-roots:
    name: ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.level_0 != '' && needs.plan.outputs.level_0 != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.level_0) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/install-runner
        with:
          repository-token: ${{ secrets.RUNNER_REPOSITORY_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: runner-plan
          path: .runner-ci
      - name: Execute ${{ matrix.task }}
        run: |
          mkdir -p .runner-ci/evidence
          "$RUNNER_BUNDLE/runner_${RUNNER_VERSION}_linux_amd64" ci execute \
            --project "$GITHUB_WORKSPACE" \
            --plan .runner-ci/plan.json \
            --task "${{ matrix.task }}" \
            --evidence ".runner-ci/evidence/${{ matrix.task }}.receipt.json" \
            --worker-id "github-${{ matrix.task }}" \
            --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-evidence-${{ matrix.task }}
          path: .runner-ci/evidence/
          if-no-files-found: error

  execute-dependents:
    name: ${{ matrix.task }}
    needs: [plan, execute-roots]
    if: always() && needs.plan.outputs.level_1 != '' && needs.plan.outputs.level_1 != '[]' && needs.execute-roots.result != 'failure'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.level_1) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/install-runner
        with:
          repository-token: ${{ secrets.RUNNER_REPOSITORY_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: runner-plan
          path: .runner-ci
      - name: Execute ${{ matrix.task }}
        run: |
          mkdir -p .runner-ci/evidence
          "$RUNNER_BUNDLE/runner_${RUNNER_VERSION}_linux_amd64" ci execute \
            --project "$GITHUB_WORKSPACE" \
            --plan .runner-ci/plan.json \
            --task "${{ matrix.task }}" \
            --evidence ".runner-ci/evidence/${{ matrix.task }}.receipt.json" \
            --worker-id "github-${{ matrix.task }}" \
            --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-evidence-${{ matrix.task }}
          path: .runner-ci/evidence/
          if-no-files-found: error

  finalize:
    name: finalize
    needs: [plan, execute-roots, execute-dependents]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/install-runner
        with:
          repository-token: ${{ secrets.RUNNER_REPOSITORY_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: runner-plan
          path: .runner-ci

      - uses: actions/download-artifact@v4
        with:
          pattern: runner-evidence-*
          merge-multiple: true
          path: .runner-ci/evidence

      - name: Combine reused and executed claims into one signed receipt
        env:
          RUNNER_RECEIPT_SIGNER_ID: github
          RUNNER_RECEIPT_SIGNING_KEY: ${{ secrets.RUNNER_RECEIPT_SIGNING_KEY }}
        run: |
          mkdir -p .runner-ci/evidence
          "$RUNNER_BUNDLE/runner_${RUNNER_VERSION}_linux_amd64" ci finalize \
            --project "$GITHUB_WORKSPACE" \
            --plan .runner-ci/plan.json \
            --evidence-dir .runner-ci/evidence \
            --policy .runner/receipt-policy.yaml \
            --policy-ref origin/main \
            --signer github \
            --commit "$GITHUB_SHA" \
            --receipt .runner-ci/final-receipt.json \
            --worker-id github-finalizer \
            --json

      - name: Publish the receipt notes for this commit
        if: always()
        run: git push origin refs/notes/runner-receipts

      - name: Summarize the run
        if: always()
        run: |
          {
            echo '| task | decision | outcome |'
            echo '| --- | --- | --- |'
            jq -r '.jobs[] | "| \(.name) | \(.scheduling.decision // "executed") | \(.state) |"' \
              .runner-ci/final-receipt.json
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-final-receipt
          path: .runner-ci/final-receipt.json
          if-no-files-found: error
