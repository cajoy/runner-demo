name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: golang:1.27.1-bookworm@sha256:648f440f42a0958804efb24df176f806f9d353b41f1c0627f666428e40310f6b
    env:
      GOENV: off
      GOWORK: off
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
      GOFLAGS: "-buildvcs=false -trimpath -mod=readonly"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch protected policy
        id: policy
        continue-on-error: true
        run: git -c safe.directory="$GITHUB_WORKSPACE" fetch origin main:refs/remotes/origin/main
      - name: Download receipt verifier
        id: verifier
        continue-on-error: true
        env:
          VERIFIER_VERSION: v0.8.34
          VERIFIER_SHA256: a1d7c16f2559d01eb6a99c1a8ade2c8183f6541f32beca7d0c8c5d59bb2a12a3
        run: |
          mkdir -p .runner-ci
          curl --fail --location --silent --show-error \
            "https://github.com/cajoy/runner-dist/releases/download/${VERIFIER_VERSION}/runner-receipt-verify_${VERIFIER_VERSION}_linux_arm64" \
            --output .runner-ci/receipt-verify
          printf '%s  %s\n' "$VERIFIER_SHA256" '.runner-ci/receipt-verify' | sha256sum --check --strict
          chmod +x .runner-ci/receipt-verify
          .runner-ci/receipt-verify --version
      - name: Verify receipts
        id: receipt
        if: ${{ steps.policy.outcome == 'success' && steps.verifier.outcome == 'success' }}
        continue-on-error: true
        env:
          RECEIVING_BRANCH: ${{ github.base_ref || github.ref_name }}
          RECEIPT_IMAGE: golang:1.27.1-bookworm@sha256:648f440f42a0958804efb24df176f806f9d353b41f1c0627f666428e40310f6b
        run: .runner-ci/receipt-verify --image "$RECEIPT_IMAGE" --branch "$RECEIVING_BRANCH"
      - name: lint
        if: ${{ steps.receipt.outcome != 'success' || !contains(fromJSON(steps.receipt.outputs.verified || '[]'), 'lint') }}
        run: go vet ./...
      - name: unit
        if: ${{ steps.receipt.outcome != 'success' || !contains(fromJSON(steps.receipt.outputs.verified || '[]'), 'unit') }}
        run: go test -count=1 -cover ./...
      - name: build
        if: ${{ steps.receipt.outcome != 'success' || !contains(fromJSON(steps.receipt.outputs.verified || '[]'), 'build') }}
        run: go build -o .local-ci-out/server .
      - name: deploy (simulation)
        run: echo "Simulated deployment. All checks passed or had verified receipts; no application was deployed."
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-verification
          path: .runner-ci/verification.json
          if-no-files-found: ignore
