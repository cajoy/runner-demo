name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: receipt
        id: receipt
        run: |
          set -euo pipefail
          git fetch --quiet origin \
            'refs/notes/runner-receipts:refs/notes/runner-receipts' 2>/dev/null || true
          note=$(git notes --ref=runner-receipts show "$GITHUB_SHA" 2>/dev/null || echo '{}')
          verified=$(printf '%s' "$note" | jq -c '
            [(.entries // [])[].envelope.payload | @base64d | fromjson
             | .tasks[] | select(.state == "passed") | .id] | unique')
          echo "verified=$verified" >>"$GITHUB_OUTPUT"
          echo "signed receipt covers: $verified"

      - name: lint
        if: ${{ !contains(fromJSON(steps.receipt.outputs.verified), 'lint') }}
        run: go vet ./...

      - name: unit
        if: ${{ !contains(fromJSON(steps.receipt.outputs.verified), 'unit') }}
        run: go test ./...

      - name: build
        if: ${{ !contains(fromJSON(steps.receipt.outputs.verified), 'build') }}
        run: go build -trimpath -o /tmp/hello .

      - name: deploy
        run: echo "deploy to production"
