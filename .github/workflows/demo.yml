name: Verified receipt reuse
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Fetch protected policy
        run: git fetch origin main:refs/remotes/origin/main
      - name: Install pinned Runner
        run: go run ./cmd/demo-install
      - name: Verify proof, execute missing checks, and simulate deployment
        env:
          RECEIVING_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: go run ./cmd/demo-ci --runner .runner-ci/bin/runner --branch "$RECEIVING_BRANCH"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-verification
          path: |
            .runner-ci/plan.json
            .runner-ci/evidence/
            .runner-ci/final-receipt.json
          if-no-files-found: ignore
