name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: receipt
        id: receipt
        run: |
          set -euo pipefail
          verified=""
          git fetch --quiet origin \
            'refs/notes/runner-receipts:refs/notes/runner-receipts' 2>/dev/null || true
          if note=$(git notes --ref=runner-receipts show "$GITHUB_SHA" 2>/dev/null); then
            verified=$(printf '%s' "$note" | jq -r '
              [.entries[].envelope.payload | @base64d | fromjson
               | .tasks[] | select(.state == "passed") | .id] | unique | join(" ")')
          fi
          echo "verified=$verified" >>"$GITHUB_OUTPUT"
          echo "signed receipt covers: ${verified:-nothing}"

      - name: lint
        run: |
          case " ${{ steps.receipt.outputs.verified }} " in
            *" lint "*) echo "skipped: already verified for this commit" ;;
            *) go vet ./... ;;
          esac

      - name: unit
        run: |
          case " ${{ steps.receipt.outputs.verified }} " in
            *" unit "*) echo "skipped: already verified for this commit" ;;
            *) go test ./... ;;
          esac

      - name: build
        run: |
          case " ${{ steps.receipt.outputs.verified }} " in
            *" build "*) echo "skipped: already verified for this commit" ;;
            *) go build -trimpath -o /tmp/hello . ;;
          esac

      - name: deploy
        run: echo "deploy to production"
