# docs/index.html is what GitHub Pages serves, and it is rendered from
# index.html by the demo binary. Nothing regenerates it automatically, so a
# template edit committed on its own deploys the previous bytes: the change is
# live in the binary and absent from the site, with every other check green.
# This job says so instead of letting it ship quietly.
#
# It is separate from demo.yml on purpose. The receipt contract pins that
# workflow's digest, so adding a step there would make CI run every check fresh
# until the contract was updated to match.
name: Page freshness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Check generated page
        run: make check-page
      - name: Check Go formatting
        run: make check-format
      - name: Check receipt contract freshness
        run: make check-contract
