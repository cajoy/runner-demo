schema: local-ci/v2
service: api
default: preflight

tasks:
  lint:
    runtime: host
    run: go vet ./...

  unit:
    runtime: host
    run: go test ./...

  build:
    run: mkdir -p .local-ci-out && go build -trimpath -o .local-ci-out/server .

  # A task that fails on purpose, so the failure path is demonstrable: the
  # dashboard shows which task failed, its exit code, and this output.
  smoke:
    runtime: host
    needs: [build]
    run: |
      echo "checking the rendered page for the release banner"
      if ! grep -q "release-banner" index.html; then
        echo "error: index.html is missing the release banner" >&2
        echo "  expected an element with class \"release-banner\"" >&2
        exit 3
      fi
      echo "ok"

  deploy-local:
    display_name: deploy
    placement: local
    needs: [lint, unit, build]
    run: echo 'deploy to production is not supported from the local runner'

  deploy-github:
    display_name: deploy
    placement: ci
    needs: [lint, unit, build]
    run: echo 'deploy to production'

entrypoints:
  preflight: [lint, unit, build]
  smoke: [smoke]
  deploy: [deploy-local]
  github: [deploy-github]
