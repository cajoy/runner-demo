schema: local-ci/v2
service: api
default: preflight
root: .

tasks:
  lint:
    run: go vet ./...

  unit:
    run: go test ./...

  build:
    run: mkdir -p .local-ci-out && go build -trimpath -o .local-ci-out/hello .

  deploy-local:
    display_name: deploy
    placement: local
    needs: [lint, unit, build]
    run: echo 'deploy to production is not supported from the local runner'

  deploy-github:
    display_name: deploy
    placement: ci
    needs: [lint, unit, build]
    run: echo 'deploy to production'

entrypoints:
  preflight: [lint, unit, build]
  deploy: [deploy-local]
  github: [deploy-github]
