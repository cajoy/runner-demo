schema: local-ci/v2
service: api
default: preflight

tasks:
  # Each task reports what it did. A receipt records that a task passed; the
  # output is what tells you what "passed" was made of, so it is worth printing
  # even on success.
  lint:
    runtime: host
    run: |
      go vet ./...
      echo "go vet: no findings in $(go list ./... | wc -l | tr -d ' ') package(s)"

  unit:
    runtime: host
    run: |
      go test -count=1 -cover ./...

  build:
    run: |
      mkdir -p .local-ci-out
      go build -trimpath -o .local-ci-out/server .
      echo "built .local-ci-out/server ($(du -h .local-ci-out/server | cut -f1))"

  # A task that fails on purpose, so the failure path is demonstrable: the
  # dashboard shows which task failed, its exit code, and this output.
  smoke:
    runtime: host
    needs: [build]
    run: |
      echo "checking the rendered page for the release banner"
      if ! grep -q "release-banner" index.html; then
        echo "error: index.html is missing the release banner" >&2
        echo "  expected an element with class \"release-banner\"" >&2
        exit 3
      fi
      echo "ok"

  deploy-local:
    display_name: deploy
    placement: local
    needs: [lint, unit, build]
    run: echo 'deploy to production is not supported from the local runner'

  deploy-github:
    display_name: deploy
    placement: ci
    needs: [lint, unit, build]
    run: echo 'deploy to production'

entrypoints:
  preflight: [lint, unit, build]
  smoke: [smoke]
  deploy: [deploy-local]
  github: [deploy-github]
