schema: local-ci/v1
service: hello
default: demo

runtime:
  image: alpine:3.22
  platform: linux/amd64
  workdir: .

jobs:
  prepare:
    executor: local
    uses: local/command@v1
    with:
      executable: scripts/prepare.sh
      working_directory: .
      arguments: '[]'
      environment: '{}'
      secret_env: '{}'
      mutation: 'false'

  test:
    executor: local
    needs: [prepare]
    uses: local/command@v1
    with:
      executable: scripts/test.sh
      working_directory: .
      arguments: '[]'
      environment: '{}'
      secret_env: '{}'
      mutation: 'false'

  finish:
    executor: local
    needs: [test]
    uses: local/command@v1
    with:
      executable: scripts/finish.sh
      working_directory: .
      arguments: '[]'
      environment: '{}'
      secret_env: '{}'
      mutation: 'false'

entrypoints:
  demo: [finish]

