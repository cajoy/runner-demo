schema: local-ci/v1
source: auto

executors:
  local:
    driver: apple-container
    allowed_drivers: [apple-container, docker]

plugins:
  oci: {executable: runner-plugin-oci}
  kubernetes: {executable: runner-plugin-kubernetes}
  local: {executable: runner-plugin-local}

concurrency: {max: 3, on_battery: 1}
store: {path: auto}
