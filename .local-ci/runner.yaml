schema: local-ci/v1
source: auto

executors:
  local:
    driver: docker
    allowed_drivers: [docker, apple-container]

# No plugins. This workflow declares no `uses:`, so no plugin binary is ever
# downloaded, discovered, or launched.

# Keep the demo's three independent checks parallel on AC and battery power.
concurrency: {max: 3, on_battery: 3}
store: {path: auto}
