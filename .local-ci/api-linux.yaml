schema: local-ci/v2
service: api-linux
default: preflight
runtime:
  image: golang:1.27.1-bookworm@sha256:648f440f42a0958804efb24df176f806f9d353b41f1c0627f666428e40310f6b
  platform: linux/arm64
env:
  GOENV: off
  GOWORK: off
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  GOFLAGS: "-buildvcs=false -trimpath -mod=readonly"
tasks:
  lint:
    verification: {kind: go, exclude: [README.md, CLAUDE.md, docs]}
    run: go vet ./...
  unit:
    verification: {kind: go, exclude: [README.md, CLAUDE.md, docs]}
    run: go test -count=1 -cover ./...
  build:
    verification: {kind: go, exclude: [README.md, CLAUDE.md, docs]}
    run: go build -o .local-ci-out/server .
    artifacts:
      server: {path: .local-ci-out/server}
entrypoints:
  preflight: [lint, unit, build]
  github: [lint, unit, build]
